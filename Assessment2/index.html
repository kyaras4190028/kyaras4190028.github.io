<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music Album Player</title>

  <!-- Vintage typewriter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./Document_files/reset.css">
  <link rel="stylesheet" href="./Document_files/style.css">
</head>

<body>

  <!-- PAPER HEADER -->
  <header>
    <h1>Assessment 2 - Browser-based Interactive Experiments</h1>
    <p>Kyara Herman - s4190028</p>
  </header>


  <!-- MAIN CONTENT -->
  <main class="container">

    <!-- TURNTABLE SECTION -->
    <section class="vinyl-section">

      <div class="turntable">

        <!-- Vinyl record image -->
        <img
          src="./Document_files/vinyl.png"
          alt="Vinyl record"
          class="vinyl-image"
        >

        <!-- Separate tonearm image -->
        <img
          src="./Document_files/tonearm.png"
          alt="Turntable tonearm"
          class="tonearm-image"
        >

        <!-- REMOTE CONTROL -->
        <div class="remote">

          <button class="remote-button" aria-label="Play"></button>

          <button class="remote-button" aria-label="Pause"></button>

          <button class="remote-button" aria-label="Stop"></button>

        </div>

      </div>

    </section>

  </main>


  <!-- FOOTER / ICON CREDITS -->
  <footer>
    <a href="https://icons8.com/icon/59862/play">Play</a> icon by
    <a href="https://icons8.com/">Icons8</a>

    <span> | </span>

    <a href="https://icons8.com/icon/61012/pause">Pause</a> icon by
    <a href="https://icons8.com/">Icons8</a>
  </footer>

</body>
</html>
