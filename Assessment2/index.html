<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title -->
  <title>Music Album Player</title>

  <!-- Vintage typewriter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./Document_files/reset.css">
  <link rel="stylesheet" href="./Document_files/style.css">

  <!-- JavaScript -->
  <script src="./Document_files/script.js" defer></script>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>Assessment 2 - Browser-based Interactive Experiments</h1>
    <p>Kyara Herman - s4190028</p>
  </header>


  <!-- Main content -->
  <main class="container">

    <section class="turntable">

      <!-- Vinyl and tonearm image -->
      <div class="vinyl-area">

        <img
          src="./Document_files/vinyl&tonearm.png"
          alt="Vinyl record and tonearm"
          class="vinyl-setup-image"
        >

        <!-- Animated music notes -->
        <div class="music-notes" id="music-notes" aria-hidden="true">
          <span>♪</span>
          <span>♫</span>
          <span>♪</span>
          <span>♫</span>
          <span>♪</span>
        </div>

      </div>


      <!-- Controls & Information -->
      <div class="player-panel">

        <div class="song-information">
          <h2>Dry Down</h2>
          <p>featuring Ben Snatch</p>
        </div>

        <!-- Song timer -->
        <div class="time-display">
          <span id="current-time">00:00</span>
          <span class="time-divider">/</span>
          <span id="duration">00:00</span>
        </div>
        <!-- I searched for tutorials on YouTube and asked ChatGPT on how to put a timer. I felt that it was necessary to include one for a complete music player experience. -->

        <!-- Progress bar -->
        <div
          class="progress-container"
          id="progress-container"
          role="slider"
          aria-label="Song progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          tabindex="0"
        >
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <!-- I searched for tutorials on Google and YouTube and asked ChatGPT on how to put a progress bar. I felt that it was necessary to include one for a complete music player experience. -->

        <!-- Buttons -->
        <div class="controls">

          <!-- Replay -->
          <button class="control-button" id="replay-button" aria-label="Replay song">
            <img src="./Document_files/replay.png" alt="">
          </button>

          <!-- Skip to start -->
          <button class="control-button" id="start-button" aria-label="Skip to start">
            <img src="./Document_files/start.png" alt="">
          </button>

          <!-- Play and pause button -->
          <button class="control-button" id="play-pause-button" aria-label="Play">
            <img id="play-pause-icon" src="./Document_files/play.png" alt="">
          </button>

          <!-- Skip to end -->
          <button class="control-button" id="end-button" aria-label="Skip to end">
            <img src="./Document_files/end.png" alt="">
          </button>

          <!-- Shuffle button -->
          <button
            class="control-button"
            id="shuffle-button"
            aria-label="Shuffle off"
            aria-pressed="false"
          >
            <img src="./Document_files/shuffle.png" alt="">
          </button>

        </div>


        <!-- Volume button -->
        <div class="volume-area">

          <button
            class="volume-button"
            id="volume-button"
            aria-label="Mute audio"
            aria-pressed="false"
          >
            <img id="volume-icon" src="./Document_files/audio.png" alt="">
          </button>

          <span id="volume-status">Sound on</span>

        </div>

      </div>

    </section>

  </main>
<!--The buttons were a challenge for me. I found it hard to make them actually work instead of just being placeholders. I had to search for tutorials on Google and get feedback from ChatGPT on how to do it as I kept having troubles with making them work.-->

  <!-- Footer -->
  <footer>
    <p>Icons by Icons8</p>
  </footer>


  <!-- Audio -->
  <audio id="song" src="./Document_files/song.mp3" preload="metadata"></audio>

</body>
</html>
