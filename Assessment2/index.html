<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music Album Player</title>

  <!-- Vintage typewriter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./Document_files/style.css">

  <!-- JavaScript -->
  <script src="./Document_files/script.js" defer></script>
</head>

<body>

  <!-- PAPER HEADER -->
  <header>
    <h1>Assessment 2 - Browser-based Interactive Experiments</h1>
    <p>Kyara Herman - s4190028</p>
  </header>

  <!-- MAIN PLAYER -->
  <main class="container">

    <section class="turntable">

      <!-- VINYL IMAGE -->
      <div class="vinyl-area">

        <img
          src="./Document_files/vinyl&tonearm.png"
          alt="Vinyl record and tonearm"
          class="vinyl-setup-image"
        >

        <!-- Animated music notes appear while the music plays -->
        <div class="music-notes" id="music-notes" aria-hidden="true"></div>

      </div>

      <!-- PLAYER CONTROLS AND TRACK INFORMATION -->
      <div class="player-panel">

        <!-- TRACK INFORMATION -->
        <div class="track-information">
          <h2 id="track-title">Dry Down</h2>
          <p id="artist-name">featuring Ben Snaath</p>
        </div>

        <!-- TIMER -->
        <div class="timer" id="timer">00:00</div>

        <!-- PROGRESS BAR -->
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- PLAYER BUTTONS -->
        <div class="controls">

          <!-- RESTART -->
          <button class="control-button" id="replay-button" aria-label="Restart track">
            <img src="./Document_files/replay.png" alt="">
          </button>

          <!-- PREVIOUS / BACK TO START -->
          <button class="control-button" id="previous-button" aria-label="Go to beginning">
            <img src="./Document_files/start.png" alt="">
          </button>

          <!-- ONE PLAY / PAUSE BUTTON -->
          <button class="control-button" id="play-pause-button" aria-label="Play music">
            <img id="play-pause-icon" src="./Document_files/play.png" alt="">
          </button>

          <!-- NEXT / END -->
          <button class="control-button" id="next-button" aria-label="Skip to end">
            <img src="./Document_files/end.png" alt="">
          </button>

          <!-- SHUFFLE -->
          <button class="control-button" id="shuffle-button" aria-label="Shuffle">
            <img src="./Document_files/shuffle.png" alt="">
          </button>

        </div>

        <!-- VOLUME BUTTON AT THE BOTTOM LEFT -->
        <div class="volume-area">
          <button class="volume-button" id="volume-button" aria-label="Mute audio">
            <img id="volume-icon" src="./Document_files/audio.png" alt="">
          </button>
          <span id="volume-label">Sound on</span>
        </div>

      </div>

    </section>

    <!-- AUDIO FILE -->
    <audio id="album-audio" preload="metadata">
      <source src="./Document_files/song.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>
      <i>Icons by
      <a href="https://icons8.com/">Icons8</a>
    </p>
  </footer>

</body>
</html>
