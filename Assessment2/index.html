<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music Album Player</title>

  <!-- Vintage typewriter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./Document_files/reset.css">
  <link rel="stylesheet" href="./Document_files/style.css">
</head>

<body>

  <!-- PAPER HEADER -->
  <header>
    <h1>Assessment 2 - Browser-based Interactive Experiments</h1>
    <p>Kyara Herman - s4190028</p>
  </header>


  <!-- MAIN CONTENT -->
  <main class="container">

    <!-- VINYL PLAYER SECTION -->
    <section class="vinyl-section">

      <div class="turntable">

        <!-- Combined vinyl record and tonearm image -->
        <img
          src="./Document_files/vinyl&tonearm.png"
          alt="Vinyl record and tonearm"
          class="vinyl-setup-image"
        >

        <!-- Decorative remote control -->
        <div class="remote" aria-label="Decorative remote control">
        </div>

      </div>

    </section>

  </main>


  <!-- FOOTER / ICON CREDITS -->
  <footer>
    <a href="https://icons8.com/icon/59862/play">Play</a> icon by
    <a href="https://icons8.com/">Icons8</a>

    <span> | </span>

    <a href="https://icons8.com/icon/61012/pause">Pause</a> icon by
    <a href="https://icons8.com/">Icons8</a>
  </footer>

</html>
