<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Design Project 2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="content">

        <h1>Assessment Task 2: Digital Design Project 2</h1>

        <h2>Kyara Richelle Herman - s4190028</h2>


        <div class="grid">

            <div class="box">
                <img src="Artboard1@2x.png" data-active="Artboard1 2@2x.png" alt="Icon 1">
            </div>

            <div class="box">
                <img src="Artboard2@2x.png" data-active="Artboard2 2@2x.png" alt="Icon 2">
            </div>

            <div class="box">
                <img src="Artboard3@2x.png" data-active="Artboard3 2@2x.png" alt="Icon 3">
            </div>

            <div class="box">
                <img src="Artboard4@2x.png" data-active="Artboard4 2@2x.png" alt="Icon 4">
            </div>

            <div class="box">
                <img src="Artboard5@2x.png" data-active="Artboard5 2@2x.png" alt="Icon 5">
            </div>

            <div class="box">
                <img src="Artboard6@2x.png" data-active="Artboard6 2@2x.png" alt="Icon 6">
            </div>

            <div class="box">
                <img src="Artboard7@2x.png" data-active="Artboard7 2@2x.png" alt="Icon 7">
            </div>

            <div class="box">
                <img src="Artboard8@2x.png" data-active="Artboard8 2@2x.png" alt="Icon 8">
            </div>

            <div class="box">
                <img src="Artboard9@2x.png" data-active="Artboard9 2@2x.png" alt="Icon 9">
            </div>

        </div>

    </div>
<script>
    const icons = document.querySelectorAll(".box img");

    icons.forEach(function(icon) {

        // Save the original image
        icon.dataset.original = icon.src;

        icon.addEventListener("click", function() {

            if (icon.src === icon.dataset.original) {
                icon.src = icon.dataset.active;
            } else {
                icon.src = icon.dataset.original;
            }

        });

    });
</script>
</body>

</html>
