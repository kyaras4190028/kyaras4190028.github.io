<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Design Project 2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="content">

        <h1>Assessment Task 2: Digital Design Project 2</h1>

        <h2>Kyara Richelle Herman s4190028</h2>


        <div class="grid">

            <div class="box">
                <img src="Artboard 1.png" data-active="Artboard 1 2.png" alt="Icon 1">
            </div>

            <div class="box">
                <img src="Artboard 2.png" data-active="Artboard 2 2.png" alt="Icon 2">
            </div>

            <div class="box">
                <img src="Artboard 3.png" data-active="Artboard 3 2.png" alt="Icon 3">
            </div>

            <div class="box">
                <img src="Artboard 4.png" data-active="Artboard 4 2.png" alt="Icon 4">
            </div>

            <div class="box">
                <img src="Artboard 5.png" data-active="Artboard 5 2.png" alt="Icon 5">
            </div>

            <div class="box">
                <img src="Artboard 6.png" data-active="Artboard 6 2.png" alt="Icon 6">
            </div>

            <div class="box">
                <img src="Artboard 7.png" data-active="Artboard 7 2.png" alt="Icon 7">
            </div>

            <div class="box">
                <img src="Artboard 8.png" data-active="Artboard 8 2.png" alt="Icon 8">
            </div>

            <div class="box">
                <img src="Artboard 9.png" data-active="Artboard 9 2.png" alt="Icon 9">
            </div>

        </div>

    </div>
<script>
    const icons = document.querySelectorAll(".box img");

    icons.forEach(function(icon) {

        icon.addEventListener("click", function() {

            const originalImage = icon.dataset.original || icon.src;
            const activeImage = icon.dataset.active;

            icon.dataset.original = originalImage;

            icon.src = activeImage;

            setTimeout(function() {
                icon.src = icon.dataset.original;
            }, 1000);

        });

    });
</script>
</body>

</html>
