
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Over Here!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="game">

        <!-- Background map -->
        <img
            src="images/map.png"
            alt="A busy festival full of people and activities"
            class="map"
        >

        <!-- Dark overlay with a transparent reveal -->
        <div class="dark-overlay" id="dark-overlay"></div>

        <!-- Instruction note -->
        <img
            src="images/note.png"
            alt="Psst... over here!"
            class="note"
        >

        <!-- Starting title screen -->
        <div class="start-screen" id="start-screen">
            <img
                src="images/title.png"
                alt="Psst... over here! Find Pip!"
                class="title-image"
                id="start-button"
                role="button"
                tabindex="0"
            >
        </div>

        <!-- Custom magnifying glass -->
        <img
            src="images/magnifyingglass.png"
            alt=""
            class="magnifying-glass"
            id="magnifying-glass"
        >

        <!-- Invisible target positioned over Pip -->
        <div class="pip-target" id="pip-target"></div>

        <!-- Congratulations popup -->
        <div class="win-screen" id="win-screen">
            <div class="win-note">
                <h1>you found pip!! 🎉</h1>
                <p>Good job, detective!</p>
                <p>Pip can't hide from you forever!</p>

            
                <button id="play-again">Play again</button>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
